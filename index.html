<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đồ RÊ MÍ 2</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            LOGO
        </div>

        <nav class="navbar">
            <a href="#home" class="nav-link active">Home</a>
            <a href="#lich" class="nav-link">Lịch</a>
            <a href="#tkb" class="nav-link">TKB</a>
            <a href="#sign" class="nav-link">Sign</a>
        </nav>

    </header>


    <!-- BANNER -->
    <section id="home" class="banner">

        <button class="arrow left" id="prevBtn">
            &lt;
        </button>

        <div class="banner-content">
            <h1 id="bannerTitle">Banner</h1>

            <div class="dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>

        <button class="arrow right" id="nextBtn">
            &gt;
        </button>

    </section>


    <!-- NỘI DUNG -->
    <section id="lich" class="content-section">

        <h2>Nội dung</h2>

        <div class="content-box">

            <div id="tkb" class="item">
                <h3>TKB</h3>
                <p>Thời khóa biểu</p>
            </div>

            <div id="sign" class="item">
                <h3>Sign</h3>
                <p>Thông tin đăng nhập / ký hiệu</p>
            </div>

        </div>

    </section>


    <!-- MAP -->
    <section class="map-section" id="map">

        <div class="map-content">

            <div>
                <span>Map</span>
            </div>

            <div>
                <span>Địa chỉ</span>
            </div>

            <div>
                <span>SĐT</span>
            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
